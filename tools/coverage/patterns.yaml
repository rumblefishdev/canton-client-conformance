# Evidence patterns per Ledger Client Standard row (case-insensitive regex, matched against hand-written
# source only; generated proto/OpenAPI code is excluded per SDK in sdks.yaml).
# A hit is EVIDENCE that the capability is present, not proof that it conforms. `manual: true` rows can't be
