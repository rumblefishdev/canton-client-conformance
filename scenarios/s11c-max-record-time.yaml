id: S11c
title: Deadline (max record time) bound by the signature
summary: >
  One prepared transaction (DA vector reject-v2-max-record-time) in three copies that differ only in
  metadata.max_record_time: as shown to the signer, removed, and one year later. Scheme V2 does not hash the
  field by design (V3, Canton 3.5.1, added it), so under V2 one signature covers every deadline. DA's TS package
  refuses such input; an SDK that hashes it is correct for V2 but leaves the deadline unsigned (a divergence).
  The vector is a V3 capture relabelled V2. Fixtures: scenarios/fixtures/max-record-time (generated by tools/max-record-time-fixtures).
needs: []
private: false
lanes: [ts, rust]
impl: signing:max_record_time
standard: [basic_infrastructure__signing, commands__external_commands]
findings: ["docs/findings-hashcheck.md §2A (maxRecordTime under V2)"]
cases:
  - id: v2-deadline
    title: Scheme V2, three deadlines
    known:
      rust:
        verdict: diverges
        finding: "findings-hashcheck §2A: Rust hashes all three to the same value (correct for V2, which does not sign the deadline); DA's package refuses the field. Documented V2 limitation; raised as nodejumper-org/canton-rust-sdk#26"
  - id: v3-control
    title: Scheme V3, three deadlines (control)
