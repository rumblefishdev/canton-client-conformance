[package]
name = "rust-nodejumper-adapter"
version = "0.1.0"
edition = "2024"
publish = false

# Pinned to the SDK commit the coverage map was taken at.
[dependencies]
canton-ledger = { git = "https://github.com/nodejumper-org/canton-rust-sdk", rev = "8d8a92bed1c4b58e01472d6f1d277b786bc6d3b2" }
canton-admin  = { git = "https://github.com/nodejumper-org/canton-rust-sdk", rev = "8d8a92bed1c4b58e01472d6f1d277b786bc6d3b2" }
canton-auth   = { git = "https://github.com/nodejumper-org/canton-rust-sdk", rev = "8d8a92bed1c4b58e01472d6f1d277b786bc6d3b2" }
canton-proto  = { git = "https://github.com/nodejumper-org/canton-rust-sdk", rev = "8d8a92bed1c4b58e01472d6f1d277b786bc6d3b2" }
tonic        = { version = "0.14", features = ["transport", "codegen", "router"] }
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures    = "0.3"
prost      = "0.14"
base64     = "0.22"
serde_json = "1"
chrono     = "0.4"
