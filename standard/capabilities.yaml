# Canton Ledger Client Standard: machine-readable capability list.
# Source: canton-network/cf-docs docs-main/sdks-tools/language-bindings/client-standard.mdx (Apache-2.0),
# last changed 2026-10-20 (#1773); copied verbatim to standard/client-standard.source.mdx. 'This standard reflects Canton 3.5.'
# id = <section>__<row>, the convention used by nodejumper-org/canton-rust-sdk conformance/capabilities.toml.
# rust_nodejumper: whether Rust SDK v0.3.2 (grant #407) claims the row; rust_id is its id where it differs.
# Rust ids with no official row (claimed against the older 2026-06 sheet): topology__generic_mappings
- id: codegen_and_bindings__daml_representation
  domain: "Codegen and bindings"
  name: "Daml representation"
  requirement: Required
  rust_nodejumper: claimed
  rust_id: codegen_and_bindings__daml_representation_codegen
  description: "Implementation contains a code-generating tool that is able to convert Daml types into the native representation in the target language. It must support - all serializable Daml types - interfaces - contract keys - dependencies"
- id: codegen_and_bindings__json_codec
  domain: "Codegen and bindings"
  name: "JSON Codec"
  requirement: Required
  rust_nodejumper: claimed
  description: "The tool extends the code-generated objects in the native language with methods to serialize and deserialize to JSON format required in the Ledger API JSON requests and responses"
- id: codegen_and_bindings__grpc_codec
  domain: "Codegen and bindings"
  name: "gRPC Codec"
  requirement: Required
  rust_nodejumper: claimed
  description: "The tool extends the code-generated objects in the native language with methods to serialize and deserialize to proto format required in the Ledger API gRPC requests and responses"
- id: codegen_and_bindings__json_bindings
  domain: "Codegen and bindings"
  name: "JSON Bindings"
  requirement: Required
  rust_nodejumper: claimed
  description: "The library provides utility wrappers in the host languages that facilitate construction and bridge the interaction between the classes generated from Ledger API OpenAPI definitions and the classes code-generated from Daml"
- id: codegen_and_bindings__grpc_bindings
  domain: "Codegen and bindings"
  name: "gRPC Bindings"
  requirement: Required
  rust_nodejumper: claimed
  description: "The library provides utility wrappers in the host languages that facilitate construction and bridge the interaction between the classes generated from Ledger API proto definitions and the classes code-generated from Daml"
- id: codegen_and_bindings__pqs_bindings
  domain: "Codegen and bindings"
  name: "PQS bindings"
  requirement: Required
  rust_nodejumper: claimed
  description: "The library provides mechanisms that bridge the interaction between the table functions in PQS and the classes code-generated from Daml"
- id: basic_infrastructure__tls
  domain: "Basic infrastructure"
  name: "TLS"
  requirement: Required
  rust_nodejumper: claimed
  description: "The library utilizes secure HTTP and gRPC connections using TLS. It supports mutual and server-side TLS."
- id: basic_infrastructure__authorization
  domain: "Basic infrastructure"
  name: "Authorization"
  requirement: Required
  rust_nodejumper: claimed
  description: "The library supports client credential workflow to obtain and refresh OAuth tokens. It has the capability to inject the JWT tokens into the call context"
- id: basic_infrastructure__error_parsing_and_handling
  domain: "Basic infrastructure"
  name: "Error parsing and handling"
  requirement: Required
  rust_nodejumper: claimed
  description: "The library has the ability to parse and process all types of errors returned by Ledger API. It supports - classification of errors into retriable and non-retriable - JSON and gRPC errors - extraction of the error code, message, request info, error info and other structured details such as contract ids, packages, party names etc."
- id: basic_infrastructure__tracing
  domain: "Basic infrastructure"
  name: "Tracing"
  requirement: Required
  rust_nodejumper: claimed
  description: "The library handles tracing according to the OpenTelemetry standard and OTLP servers. It supports - creation and injection of trace ids into the headers of the requests - extraction of trace ids from the response - support JSON and gRPC requests - report the spans to the OpenTelemetry compatible OTLP server"
- id: basic_infrastructure__retry_logic
  domain: "Basic infrastructure"
  name: "Retry logic"
  requirement: Required
  rust_nodejumper: claimed
  description: "The library handles seamlessly the retry logic for Ledger API calls. It supports - retries on retriable errors only - timeouts - maximum number of retries"
- id: basic_infrastructure__logging
  domain: "Basic infrastructure"
  name: "Logging"
  requirement: Required
  rust_nodejumper: claimed
  description: "The library is able to log using a standard library adequate for the host language. It supports - logging requests and responses - utilizes trace-ids - verbose logging of Ledger API errors - configurable log level sensitivity - configurable log destination - configurable log format"
- id: basic_infrastructure__metrics
  domain: "Basic infrastructure"
  name: "Metrics"
  requirement: Required
  rust_nodejumper: claimed
  description: "The library handles metrics according to OpenTelemetry standard It supports - sending metrics to the OTLP server - reporting vitals of the communication: number of requests and responses - breakdown by error and success - breakdown by endpoint"
- id: basic_infrastructure__signing
  domain: "Basic infrastructure"
  name: "Signing"
  requirement: Required
  rust_nodejumper: claimed
  description: "The library supports signing algorithms that are needed in the externally signed Ledger API endpoints. It supports - KMS systems - keys provided in a file - all algorithms supported by Canton"
- id: basic_infrastructure__node_health
  domain: "Basic infrastructure"
  name: "Node Health"
  requirement: Required
  rust_nodejumper: claimed
  description: "The library supports monitoring node's health letting the client applications respond to the intermittent and permanent failure situations."
